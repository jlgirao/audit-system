name: Deploy Laravel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy no servidor
        uses: appleboy/ssh-action@v1

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            set -e

            echo "======================================"
            echo " Iniciando deploy do Audit System"
            echo "======================================"

            cd /home/fix-srv/public_html/audit-system

            echo "Configurando diretório seguro do Git..."
            git config --global --add safe.directory /home/fix-srv/public_html/audit-system

            echo "Atualizando código..."
            git pull origin main

            echo "Instalando dependências..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "Executando migrations..."
            php artisan migrate --force

            echo "Limpando caches..."
            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear

            echo "Recriando caches..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "Otimizando aplicação..."
            php artisan optimize

            echo "Reiniciando filas..."
            php artisan queue:restart || true

            echo "======================================"
            echo " Deploy concluído com sucesso"
            echo "======================================"